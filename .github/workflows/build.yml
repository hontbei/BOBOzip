name: Build Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Windows: portable single-file exe + MSIX package
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable exe
        run: python -m PyInstaller bobozip.spec --clean --noconfirm

      - name: Rename portable exe
        run: Copy-Item dist/BOBOzip.exe dist/BOBOzip-portable.exe
        shell: pwsh

      - name: Build MSIX package
        shell: pwsh
        run: ./packaging/build_msix.ps1 -ExePath dist/BOBOzip.exe -OutputDir dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BOBOzip-portable.exe
            dist/*.msix

  # ---------------------------------------------------------------------------
  # Linux: AppImage (best-effort, not the primary target)
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Linux binary
        run: python -m PyInstaller bobozip.spec --clean --noconfirm

      - name: Package AppImage
        run: bash packaging/build_appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with all artifacts when a tag is pushed
  # ---------------------------------------------------------------------------
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/linux/*
          generate_release_notes: true
